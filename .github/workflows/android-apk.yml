name: Build MSPS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > gradle.properties

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/amu/hostel
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MSPS"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.amu.hostel'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.amu.hostel'
                  minSdk 23
                  targetSdk 34
                  versionCode 4
                  versionName '1.3'
              }
          }

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          dependencies {
              implementation 'androidx.activity:activity:1.9.3'
          }
          EOF

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp amu-icon-512.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp amu-icon-512.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp amu-icon-512.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp amu-icon-512.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp amu-icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="MSPS MANAGEMENT"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/amu/hostel/MainActivity.java <<'EOF'
          package com.amu.hostel;

          import android.content.Context;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.widget.Toast;

          import androidx.activity.ComponentActivity;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.view.WindowCompat;

          public class MainActivity extends ComponentActivity {
              private WebView webView;

              public final class AndroidPrintBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          if (webView == null) {
                              Toast.makeText(MainActivity.this,
                                  "Print error: page is not ready.", Toast.LENGTH_LONG).show();
                              return;
                          }
                          // Let the WebView finish laying out the prepared report before capture.
                          webView.postDelayed(() -> createWebPrintJob(), 300);
                      });
                  }
              }

              private void createWebPrintJob() {
                  try {
                      if (webView == null) {
                          Toast.makeText(this, "Print error: page is not ready.",
                              Toast.LENGTH_LONG).show();
                          return;
                      }
                      PrintManager printManager =
                          (PrintManager) getSystemService(Context.PRINT_SERVICE);
                      if (printManager == null) {
                          Toast.makeText(this, "Print service is unavailable.",
                              Toast.LENGTH_LONG).show();
                          return;
                      }

                      PrintDocumentAdapter adapter =
                          webView.createPrintDocumentAdapter("MSPS MANAGEMENT Report");
                      PrintAttributes attributes = new PrintAttributes.Builder().build();
                      printManager.print("MSPS MANAGEMENT", adapter, attributes);
                  } catch (Exception e) {
                      Toast.makeText(this, "Could not start printing: " + e.getMessage(),
                          Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Keep app content below the Android status bar and camera cutout.
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                  );
                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                          View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  webView.addJavascriptInterface(new AndroidPrintBridge(), "AMUAndroidPrint");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://hostel2943-tech.github.io/AMU-Android-/");
                  setContentView(webView);

                  getOnBackPressedDispatcher().addCallback(this,
                      new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              if (webView != null && webView.canGoBack()) {
                                  webView.goBack();
                              } else {
                                  setEnabled(false);
                                  getOnBackPressedDispatcher().onBackPressed();
                              }
                          }
                      });
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSPS-Management-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
